<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English — to be</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .match-grid {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            gap: 12px 20px;
            align-items: center;
            max-width: 520px;
            margin: 0 auto 20px;
        }
        .match-pronoun {
            text-align: right;
            font-size: 1.6em;
            font-weight: bold;
            color: #8B0000;
            padding: 8px 12px;
        }
        .match-dash { color: #999; font-size: 1.4em; text-align: center; }
        .match-slot {
            min-height: 48px;
            border: 3px dashed #8B0000;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #fffaf5;
            font-size: 1.4em;
            font-weight: bold;
            color: #8B0000;
            cursor: pointer;
            transition: 0.2s;
        }
        .match-slot.filled {
            border-style: solid;
            background: #fff;
        }
        .match-slot.correct {
            background: #d4edda;
            border-color: #28a745;
            color: #155724;
            cursor: default;
        }
        .match-slot.incorrect {
            background: #f8d7da;
            border-color: #dc3545;
        }
        .match-slot.selected-target {
            box-shadow: 0 0 0 3px rgba(139, 0, 0, 0.25);
            background: #ffe8e0;
        }
        .form-bank {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin: 16px 0 8px;
        }
        .form-chip {
            min-width: 72px;
            padding: 12px 18px;
            border: 3px solid #8B0000;
            border-radius: 999px;
            background: linear-gradient(45deg, #8B0000, #DC143C);
            color: #fff;
            font-size: 1.3em;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        .form-chip:hover { transform: translateY(-2px); }
        .form-chip.selected {
            outline: 3px solid #8B0000;
            box-shadow: 0 0 0 3px rgba(139,0,0,0.2);
            transform: scale(1.05);
        }
        .form-chip.used {
            opacity: 0.35;
            cursor: default;
            transform: none;
        }
        .write-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin: 18px 0;
            flex-wrap: wrap;
        }
        .write-pronoun {
            font-size: 2.2em;
            font-weight: bold;
            color: #8B0000;
            min-width: 80px;
            text-align: right;
        }
        .write-input {
            font-size: 1.8em;
            font-weight: bold;
            color: #8B0000;
            text-align: center;
            padding: 10px 14px;
            border: 3px solid #8B0000;
            border-radius: 12px;
            width: min(220px, 70vw);
            background: #fff;
        }
        .hint {
            text-align: center;
            color: #666;
            margin-bottom: 14px;
        }
        .progress-mini {
            text-align: center;
            color: #8B0000;
            font-weight: bold;
            margin-top: 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>to be</h1>
            <a href="english3.html" style="color:#8B0000;text-decoration:none;font-weight:bold;">← Назад к English</a>
        </header>

        <div class="game-area">
            <div class="top-controls" style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-bottom:15px;">
                <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center;">
                    <button id="mode-match" class="mode-btn active-mode">Сопоставь</button>
                    <button id="mode-write" class="mode-btn">Напиши</button>
                </div>
            </div>

            <div id="match-mode">
                <div class="hint">Выбери форму справа (am / is / are), затем нажми на пустое место рядом с местоимением.</div>
                <div class="form-bank" id="form-bank"></div>
                <div class="match-grid" id="match-grid"></div>
                <div class="controls" style="margin-top:16px;">
                    <button id="match-reset" class="action-btn">Начать заново</button>
                    <button id="match-check" class="action-btn">Проверить</button>
                </div>
            </div>

            <div id="write-mode" style="display:none;">
                <div class="hint">Напиши форму <strong>to be</strong> (am / is / are)</div>
                <div class="write-row">
                    <span class="write-pronoun" id="write-pronoun">I</span>
                    <input type="text" class="write-input" id="write-input" autocomplete="off" spellcheck="false" placeholder="???">
                </div>
                <div class="progress-mini" id="write-progress">1 / 7</div>
                <div class="controls" style="margin-top:16px;">
                    <button id="write-prev" class="prev-btn">Предыдущее</button>
                    <button id="write-check" class="action-btn">Проверить</button>
                    <button id="write-next" class="action-btn">Следующее</button>
                </div>
            </div>

            <div class="feedback" id="feedback"></div>
        </div>

        <div class="stats">
            <div class="stat-item">
                <span class="stat-label">Правильно:</span>
                <span class="stat-value" id="correct-count">0</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">Неправильно:</span>
                <span class="stat-value" id="incorrect-count">0</span>
            </div>
        </div>
    </div>

    <script src="english-tobe.js?v=10"></script>
</body>
</html>
