<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3 класс - Орфограммы</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>📝 Орфограммы</h1>
            <p>Поможем выучить правильное написание русских слов!</p>
            <a href="russian3.html" style="color: #8B0000; text-decoration: none; font-weight: bold;">← Назад к выбору</a>
        </header>

        <div class="game-area">
            <div class="top-controls" style="display:flex; gap:10px; flex-wrap:wrap; justify-content:center; margin-bottom:15px;">
                <div style="display:flex; gap:8px; flex-wrap:wrap; justify-content:center;">
                    <button id="mode-choice" class="mode-btn active-mode">Выбери правильное написание</button>
                    <button id="mode-missing" class="mode-btn">Впиши недостающую букву</button>
                    <button id="mode-dictate" class="mode-btn">Напиши на слух</button>
                </div>
                <div style="display:flex; gap:8px; align-items:center;">
                    <span>Тренировка:</span>
                    <label><input type="radio" name="train-size" id="train-all" checked> все слова</label>
                    <label><input type="radio" name="train-size" id="train-15"> 15 случайных</label>
                </div>
            </div>

            <div class="word-display" id="word-display" style="display:none;">
                <!-- Word display hidden to avoid showing correct spelling -->
            </div>

            <!-- Multiple Choice Mode -->
            <div class="game-mode" id="multiple-choice-mode">
                <div class="options-container" id="options-container">
                    <!-- Options will be generated here -->
                </div>
            </div>

            <!-- Missing Letter Mode -->
            <div class="game-mode" id="missing-letter-mode" style="display:none;">
                <div id="missing-letter-container">
                    <!-- Missing letter content will be generated here -->
                </div>
            </div>

            <!-- Dictate Mode -->
            <div class="game-mode" id="dictate-mode" style="display:none;">
                <div id="dictate-container" style="text-align:center;">
                    <!-- Filled by JS -->
                </div>
            </div>

            <div class="feedback" id="feedback"></div>
            <div class="controls">
                <button id="prev-word" class="prev-btn">Предыдущее слово</button>
                <button id="next-word" class="next-btn">Следующее слово</button>
                <button id="show-answer" class="action-btn">Показать ответ</button>
            </div>
        </div>

        <div class="stats">
            <div class="stat-item">
                <span class="stat-label">Правильно:</span>
                <span class="stat-value" id="correct-count">0</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">Неправильно:</span>
                <span class="stat-value" id="incorrect-count">0</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">Всего слов:</span>
                <span class="stat-value" id="total-count">0</span>
            </div>
        </div>

        <div class="progress">
            <div class="progress-bar">
                <div class="progress-fill" id="progress-fill"></div>
            </div>
            <span class="progress-text" id="progress-text">0/0</span>
        </div>
    </div>

    <script src="spelling-words-grade3.js"></script>
    <script src="spelling.js"></script>
</body>
</html>
